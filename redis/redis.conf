# Persist AOF so data survives restart
appendonly yes
appendfsync everysec

# Listen inside container only; host bind is controlled by compose ports
bind 0.0.0.0
protected-mode yes

# Dangerous commands off
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG ""

tcp-keepalive 60
timeout 300
maxmemory-policy allkeys-lru
